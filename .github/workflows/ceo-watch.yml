name: CEO change watch

# Every Monday ~9am Eastern (13:00 UTC), scan SEC EDGAR for 8-K Item 5.02 filings
# from the previous Monday-Sunday and open an Issue if anything is flagged.
# Run it by hand any time from the Actions tab ("Run workflow"); optionally set
# a custom date window, e.g. to test against a past week.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      start:
        description: "Window start, YYYY-MM-DD (blank = last Monday)"
        required: false
        default: ""
      end:
        description: "Window end, YYYY-MM-DD (blank = yesterday)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan SEC EDGAR
        id: scan
        env:
          # Repo variable (Settings > Secrets and variables > Actions > Variables):
          # SEC_USER_AGENT = CEO Signal your.name@example.com
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python scripts/check_ceo_changes.py --start "$START" --end "$END"

      - name: Open issue with the report
        if: steps.scan.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW: ${{ steps.scan.outputs.window }}
        run: |
          gh label create ceo-watch --color 0E8A16 \
            --description "Possible CEO change flagged from SEC filings" 2>/dev/null || true
          gh issue create \
            --title "CEO watch: possible changes ($WINDOW)" \
            --label ceo-watch \
            --body-file ceo_watch_report.md
