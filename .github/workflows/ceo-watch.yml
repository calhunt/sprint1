name: CEO change watch

# Two things you can run by hand from the Actions tab ("Run workflow"):
#   mode = setup : one-time. Builds data/sec_ids.json (company -> SEC ID) and
#                  saves it to the repo.
#   mode = scan  : checks SEC EDGAR for 8-K Item 5.02 filings and opens an Issue
#                  if anything is flagged. Optional start/end dates let you test
#                  against a past week.
# It also runs automatically as a scan every Monday ~9am Eastern (13:00 UTC),
# covering the previous Monday-Sunday.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options:
          - scan
          - setup
        default: scan
      start:
        description: "Scan window start, YYYY-MM-DD (blank = last Monday)"
        required: false
        default: ""
      end:
        description: "Scan window end, YYYY-MM-DD (blank = yesterday)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup - build SEC ID list
        if: inputs.mode == 'setup'
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          python scripts/check_ceo_changes.py --init-ciks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sec_ids.json
          git commit -m "Add SEC ID list (auto-generated; review sec_name values)" || echo "Nothing to commit"
          git push

      - name: Scan SEC EDGAR
        id: scan
        if: inputs.mode != 'setup'
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python scripts/check_ceo_changes.py --start "$START" --end "$END"

      - name: Open issue with the report
        if: steps.scan.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW: ${{ steps.scan.outputs.window }}
        run: |
          gh label create ceo-watch --color 0E8A16 \
            --description "Possible CEO change flagged from SEC filings" 2>/dev/null || true
          gh issue create \
            --title "CEO watch: possible changes ($WINDOW)" \
            --label ceo-watch \
            --body-file ceo_watch_report.md
